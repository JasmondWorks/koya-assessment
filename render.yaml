services:
  - type: web
    name: clinic-booking-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
