services:
  - type: web
    name: clinic-booking-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
